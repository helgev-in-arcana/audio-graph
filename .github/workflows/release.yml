name: Release

# Runs only when a `v1.2.3` tag is pushed. A tag glob cannot be narrowed to a
# branch, so whether the commit is one of main's is checked for real in the
# first job.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

# Only creating the release and uploading its assets needs write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # The gate that decides whether a commit may be handed out. It asks two
  # things: that the commit is on main, and that CI went green for it. A tag
  # that fails either never reaches the build.
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Asking after a CI run needs this.
      actions: read
    steps:
      # Third-party actions are pinned by commit, not by tag: a tag can be
      # moved to point at other code, and this workflow hands binaries to
      # people who install them. The version beside each is what that commit
      # was released as.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Verify the tag is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at a commit that is not on main."
            exit 1
          fi

      # Checking is CI's work, and the release takes that result on trust. To
      # take it on trust is to owe the question asked here: did it actually
      # pass? Otherwise a commit nobody checked has a route to becoming
      # something people download.
      #
      # CI runs on the tip that was pushed, so tagging a commit from the middle
      # of a batch of pushed commits stops here. The tag belongs on a SHA that
      # CI has really seen.
      - name: Verify CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # How many runs of CI for this SHA finished green.
          query="repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs"
          query="${query}?head_sha=${GITHUB_SHA}&status=success"
          runs=$(gh api "$query" --jq '.total_count')
          if [ "$runs" -eq 0 ]; then
            echo "::error::No successful CI run for ${GITHUB_SHA}. Tag a commit CI has passed."
            exit 1
          fi

  # Each target is built on a runner of its own architecture. The bundler reads
  # the built binary to decide the target, so cross-compiling is not what
  # stands in the way; building natively is what lets each OS's own linker and
  # system libraries be the ones used.
  #
  # All this job does is build and package. The checking was done by the CI run
  # the guard asked after, across these same six targets. Doing it twice buys
  # nothing but a slower release and one more way to go red only once the tag
  # is cut.
  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: x86_64-windows
          - os: windows-11-arm
            name: aarch64-windows
          - os: ubuntu-latest
            name: x86_64-linux
          - os: ubuntu-24.04-arm
            name: aarch64-linux
          - os: macos-15-intel
            name: x86_64-macos
          - os: macos-14
            name: aarch64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The same setup the CI build jobs get, minus Xvfb: nothing here runs a
      # test, so nothing here wants a display. The compiler is the one
      # `rust-toolchain.toml` names rather than whichever stable the runner
      # happened to meet that morning.
      - uses: ./.github/actions/rust

      # No build cache, unlike CI. A cache is worth having where a run's
      # product is a verdict; what this run produces is the file people
      # install, and that should owe nothing to what an earlier run left lying
      # about.

      # A tag and a crate version that disagree make a release calling itself
      # `v0.2.0` whose plugin reports 0.1.0 — a mismatch that is hard to chase
      # from either end.
      - name: Verify the tag matches the crate version
        shell: bash
        run: |
          # A suffix like `-alpha` may or may not be present on the Cargo.toml
          # side, so both are trimmed to x.y.z before comparing.
          tag="${GITHUB_REF_NAME#v}"
          tag="${tag%%-*}"
          # `pkgid` answers `...#audio-graph-plugin@0.1.0` or `...#0.1.0`
          # depending on whether the directory name matches the crate name, so
          # take whatever follows the last `#` or `@`. Cheaper than reading
          # JSON, which would want another tool.
          crate=$(cargo pkgid -p audio-graph-plugin)
          crate="${crate##*[#@]}"
          crate="${crate%%-*}"
          if [ "$tag" != "$crate" ]; then
            echo "::error::The tag says ${GITHUB_REF_NAME}, Cargo.toml says $crate."
            exit 1
          fi

      # What a DAW expects is a bundle rather than a bare shared library. xtask
      # sees to the cargo build and the packing together, so what ships comes
      # out of this one call. The output is target/bundled/, and which formats
      # appear is decided by the symbols the binary exports: audio-graph-plugin
      # emits both a VST3 and a CLAP.
      #
      # `--locked` is what keeps what ships and what Cargo.lock records from
      # parting ways. Where the lock is stale cargo resolves again without
      # saying so, and out goes a binary built against dependencies the
      # repository never recorded.
      #
      # xtask checks what it produced, so a format that went missing, or a
      # bundle that is a name with nothing loadable inside, fails here rather
      # than in someone's plugin folder.
      - name: Bundle the VST3 and the CLAP
        run: cargo xtask bundle audio-graph-plugin --release --locked

      # The Windows runners have no zip, so pwsh does the packing. The licences
      # and the attribution travel with the binaries.
      - name: Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "AudioGraph-${{ github.ref_name }}-${{ matrix.name }}"
          Compress-Archive -Path target/bundled/AudioGraph.vst3, target/bundled/AudioGraph.clap, LICENSE-MIT, LICENSE-APACHE, THIRD-PARTY-NOTICES.md, README.md -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" |
            Out-File -Encoding ascii "$name.zip.sha256"

      # Unix packs with zip. Unlike Compress-Archive it keeps the executable
      # bit and symbolic links, so the macOS bundle survives the round trip.
      - name: Package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="AudioGraph-${GITHUB_REF_NAME}-${{ matrix.name }}"
          (cd target/bundled && zip -qry "../../$name.zip" AudioGraph.vst3 AudioGraph.clap)
          zip -qj "$name.zip" LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.md README.md
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            shasum -a 256 "$name.zip" > "$name.zip.sha256"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundles-${{ matrix.name }}
          path: |
            *.zip
            *.zip.sha256
          if-no-files-found: error

  # One unverified platform failing should not hold back a release for the
  # platforms that were verified. What built is handed out, and what is missing
  # is legible from the body. Only a failed guard means nothing goes out at all.
  #
  # `!cancelled()` rather than `always()`: a run someone stopped by hand should
  # not go on to publish whichever half of the targets had finished by then.
  release:
    needs: [guard, build]
    if: ${{ !cancelled() && needs.guard.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      # So that a total failure does not produce an empty release, and so that
      # what is missing is written down. Reading this says which target to go
      # after.
      - name: Check what was built
        run: |
          shopt -s nullglob
          built=(dist/*.zip)
          if [ ${#built[@]} -eq 0 ]; then
            echo "::error::Not one target built. Making no release."
            exit 1
          fi
          echo "### Assets built" >> "$GITHUB_STEP_SUMMARY"
          for f in "${built[@]}"; do
            echo "- $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "${{ needs.build.result }}" != 'success' ]; then
            echo "::warning::Some targets failed to build. Releasing without them."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Some targets failed to build." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Release notes are not generated; the body is written by hand. A tag
      # carrying a suffix like `-rc.1` is published as a prerelease.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
