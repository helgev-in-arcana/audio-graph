name: Release

# `v1.2.3` を打った時だけ動く。タグの glob はブランチを絞れないので、
# main に含まれるコミットかどうかは最初のジョブで実際に確認する。
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

# リリースの作成とアセットのアップロードにだけ書き込みが要る。
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # main から生えていないタグでリリースを作らないための門番。
  # 誤ったブランチのタグはここで落ちて、ビルドまで進まない。
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify the tag is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} は main に含まれないコミットを指しています。"
            exit 1
          fi

  # ターゲットごとにネイティブのランナーで組む。xtask のバンドラは組み上がった
  # バイナリを読んでターゲットを判定するのでクロスコンパイル自体は妨げないが、
  # 各アーキテクチャで実際にテストを通してから配りたいので、ランナーを並べる。
  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: x86_64-windows
          - os: windows-11-arm
            name: aarch64-windows
          - os: ubuntu-latest
            name: x86_64-linux
          - os: ubuntu-24.04-arm
            name: aarch64-linux
          - os: macos-15-intel
            name: x86_64-macos
          - os: macos-14
            name: aarch64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # X11 のヘッダはエディタまわりが要求する。Linux ランナーには入っていない。
      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcb1-dev pkg-config

      # タグとクレートのバージョンがずれると、`v0.2.0` を名乗るリリースの中身が
      # 0.1.0 を報告するプラグイン、という追いにくい形で食い違う。
      - name: Verify the tag matches the crate version
        shell: bash
        run: |
          # `-alpha` のような接尾辞は Cargo.toml 側にある場合とない場合があるので、
          # 両側から落として x.y.z だけを突き合わせる。
          tag="${GITHUB_REF_NAME#v}"
          tag="${tag%%-*}"
          # `pkgid` はディレクトリ名がクレート名と一致するかで
          # `...#audio-graph-plugin@0.1.0` と `...#0.1.0` を返し分けるので、
          # 最後の `#` か `@` 以降を取る。JSON を読むより追加のツールが要らない。
          crate=$(cargo pkgid -p audio-graph-plugin)
          crate="${crate##*[#@]}"
          crate="${crate%%-*}"
          if [ "$tag" != "$crate" ]; then
            echo "::error::タグ ${GITHUB_REF_NAME} に対し Cargo.toml のバージョンは $crate です。"
            exit 1
          fi

      # clap-host のテストは clap-test-plugin の cdylib を読む。cargo は他の
      # パッケージの cdylib を勝手には組まないので、テストより先に一度組む。
      # memo/CHECKS.md が手元の手順として言っているのと同じ理由。
      - name: Build the test fixtures
        run: cargo build --workspace

      # 壊れたバイナリを配らないための最低限の関門。
      # fmt / clippy は普段の CI 側の仕事なのでここには置かない。
      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --workspace --release

      # DAW が期待するのは素の共有ライブラリではなくバンドル。xtask が
      # cargo build と梱包をまとめて面倒を見る。出力は target/bundled/ で、
      # どの形式が出るかはバイナリがエクスポートしている記号で決まる。
      # audio-graph-plugin は VST3 と CLAP の両方を出す。
      - name: Bundle the VST3 and the CLAP
        run: cargo xtask bundle audio-graph-plugin --release

      # 片方しか出ていなければ、リリースまで進む前にここで気付きたい。
      # CLAP は Windows / Linux では単一ファイル、macOS ではバンドルディレクトリ。
      - name: Verify both bundles exist
        shell: bash
        run: |
          for f in target/bundled/AudioGraph.vst3 target/bundled/AudioGraph.clap; do
            if [ ! -e "$f" ]; then
              echo "::error::$f が生成されていません。"
              exit 1
            fi
          done

      # Windows のランナーには zip が入っていないので pwsh で固める。
      # ライセンスと著作権表示はバイナリと一緒に配る。
      - name: Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "AudioGraph-${{ github.ref_name }}-${{ matrix.name }}"
          Compress-Archive -Path target/bundled/AudioGraph.vst3, target/bundled/AudioGraph.clap, LICENSE-MIT, LICENSE-APACHE, THIRD-PARTY-NOTICES.md, README.md -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" |
            Out-File -Encoding ascii "$name.zip.sha256"

      # Unix 側は zip でまとめる。Compress-Archive と違い実行ビットとシンボリック
      # リンクを保てるので、macOS のバンドルがそのまま展開できる。
      - name: Package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="AudioGraph-${GITHUB_REF_NAME}-${{ matrix.name }}"
          (cd target/bundled && zip -qry "../../$name.zip" AudioGraph.vst3 AudioGraph.clap)
          zip -qj "$name.zip" LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.md README.md
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            shasum -a 256 "$name.zip" > "$name.zip.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.name }}
          path: |
            *.zip
            *.zip.sha256
          if-no-files-found: error

  # 未検証のプラットフォームが 1 つ落ちただけで、動作確認済みの Windows まで
  # リリースが出ないのは困る。組めたものだけを配り、欠けた分は本文で分かる
  # ようにする。guard が落ちた場合だけは何も出さない。
  release:
    needs: [guard, build]
    if: always() && needs.guard.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 全滅した時に空のリリースを作らないための確認。ついでに、何が欠けたかを
      # サマリに残す。ここを読めば、どのターゲットを追いかければいいか分かる。
      - name: Check what was built
        run: |
          shopt -s nullglob
          built=(dist/*.zip)
          if [ ${#built[@]} -eq 0 ]; then
            echo "::error::どのターゲットもビルドできていません。リリースは作りません。"
            exit 1
          fi
          echo "### ビルドできたアセット" >> "$GITHUB_STEP_SUMMARY"
          for f in "${built[@]}"; do
            echo "- $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "${{ needs.build.result }}" != 'success' ]; then
            echo "::warning::一部のターゲットがビルドに失敗しました。揃っていないままリリースします。"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "一部のターゲットはビルドに失敗しました。" >> "$GITHUB_STEP_SUMMARY"
          fi

      # リリースノートは自動生成せず、本文は手で書く。
      # `-rc.1` のような接尾辞が付いたタグはプレリリース扱いにする。
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
