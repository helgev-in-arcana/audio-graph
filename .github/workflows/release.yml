name: Release

# `v1.2.3` を打った時だけ動く。タグの glob はブランチを絞れないので、
# main に含まれるコミットかどうかは最初のジョブで実際に確認する。
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

# リリースの作成とアセットのアップロードにだけ書き込みが要る。
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # main から生えていないタグでリリースを作らないための門番。
  # 誤ったブランチのタグはここで落ちて、ビルドまで進まない。
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify the tag is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} は main に含まれないコミットを指しています。"
            exit 1
          fi

  build:
    needs: guard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # タグとクレートのバージョンがずれると、`v0.2.0` を名乗るリリースの中身が
      # 0.1.0 を報告するプラグイン、という追いにくい形で食い違う。
      - name: Verify the tag matches the crate version
        shell: pwsh
        run: |
          # `-alpha` のような接尾辞は Cargo.toml 側にある場合とない場合があるので、
          # 両側から落として x.y.z だけを突き合わせる。
          $tag = "${{ github.ref_name }}" -replace '^v', '' -replace '-.*$', ''
          $crate = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).packages |
            Where-Object { $_.name -eq 'audio-graph-plugin' } | Select-Object -ExpandProperty version
          $crate = $crate -replace '-.*$', ''
          if ($tag -ne $crate) {
            Write-Output "::error::タグ ${{ github.ref_name }} に対し Cargo.toml のバージョンは $crate です。"
            exit 1
          }

      # 壊れたバイナリを配らないための最低限の関門。
      # fmt / clippy は普段の CI 側の仕事なのでここには置かない。
      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --workspace --release

      # DAW が期待するのは素の .dll ではなくバンドル。host-cli で包む。
      - name: Bundle the VST3
        run: cargo run -p host-cli --release -- bundle target/release/audio_graph_plugin.dll target/AudioGraph.vst3

      - name: Package
        shell: pwsh
        run: |
          $name = "AudioGraph-${{ github.ref_name }}-x86_64-windows"
          # ライセンスと著作権表示はバイナリと一緒に配る。
          Compress-Archive -Path target/AudioGraph.vst3, LICENSE-MIT, LICENSE-APACHE, THIRD-PARTY-NOTICES.md, README.md -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" |
            Out-File -Encoding ascii "$name.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-vst3
          path: |
            *.zip
            *.zip.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # リリースノートは自動生成せず、本文は手で書く。
      # `-rc.1` のような接尾辞が付いたタグはプレリリース扱いにする。
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
