name: CI

# PR とmainへのpushで動く。リリースのタグを打ってから
# 「Linuxでコンパイルが通らない」と気付くのは遅すぎるので、
# ビルドはリリースと同じ6ターゲットで、同じ手順で回す。
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# 同じブランチに続けてpushした時、古い方は用がない。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # 書式と lint はプラットフォームに依らないので1回だけ。
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      # 警告ゼロを維持する。新しい警告は PR の時点で落とす。
      # clippy はこのジョブにしか置かない。test ジョブにも置くと、
      # ビルドが壊れたのか lint に引っかかっただけなのかがログから
      # 読み取りにくくなる。
      #
      # 代償として、ここは ubuntu なので Windows 限定のコードは lint
      # されない。そこは各 OS の build/test が拾う。
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # リリースと同じ6ターゲット。ここが緑なら、タグを打った時に
  # 初めて知るコンパイルエラーは残っていない。
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - windows-11-arm
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # X11 のヘッダはエディタまわりが要求する。Linux ランナーには入っていない。
      # Xvfb はテスト用。理由は下の Test ステップ。
      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcb1-dev pkg-config xvfb

      # clap-host のテストは clap-test-plugin の cdylib を読む。cargo は他の
      # パッケージの cdylib を勝手には組まないので、テストより先に一度組む。
      # memo/CHECKS.md が手元の手順として言っているのと同じ理由。
      - name: Build the test fixtures
        run: cargo build --workspace

      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --workspace

      # Linux のウィンドウのテストは本物の X ウィンドウを開くので、
      # ランナーには X サーバが要る。ここを Xvfb で走らせることで、
      # 「ウィンドウを開くテストが CI で 1 つも走らない」という穴
      # (memo/UNTESTED.md UT-3) が Linux については塞がる。
      - name: Test (under an X server)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --workspace

      # リリースで実際に配るのは release ビルドなので、そこまで確かめる。
      - name: Build release
        run: cargo build --workspace --release

      # 配るのは素の共有ライブラリではなくバンドルなので、梱包まで CI で通す。
      # バンドラが壊れているのをタグを打ってから知るのは遅い。
      - name: Bundle
        run: cargo xtask bundle audio-graph-plugin --release

      # 出る形式はバイナリのエクスポート記号で決まる。片方だけ消えるのは
      # ここでしか気付けないので、両方あることを確かめる。
      - name: Verify both bundles exist
        shell: bash
        run: |
          for f in target/bundled/AudioGraph.vst3 target/bundled/AudioGraph.clap; do
            if [ ! -e "$f" ]; then
              echo "::error::$f が生成されていません。"
              exit 1
            fi
          done
