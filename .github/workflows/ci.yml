name: CI

# Runs on pull requests and on pushes to main. Every check this project has
# lives here: the release workflow builds and packages and does nothing else,
# so a green run here is the whole of what says a commit is fit to ship.
#
# The build covers the same six targets as the release, by the same steps.
# Finding out at the tag that the code does not compile on Linux is too late.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A pull request has no use for the older run once a newer push supersedes
  # it. main is not the same: the release guard asks whether CI went green for
  # the commit being tagged, so cancelling a run there would leave commits that
  # no run ever finished judging, and a commit like that cannot be released.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting and lints do not vary by platform, so they run once.
  lint:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned by commit, not by tag: a tag can be
      # moved to point at other code, and this workflow is a step away from one
      # that signs binaries other people install. The version beside each is
      # what the commit was released as.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # `rust-toolchain.toml` names the version. This installs what it names,
      # components and all, so the workflow never has to repeat the number.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all -- --check

      # Hold the warning count at zero, so a new warning is dealt with while
      # the pull request is open. clippy lives in this job alone. Putting it in
      # the test job as well costs the log its legibility: whether the build
      # broke or a lint merely fired stops being answerable at a glance.
      #
      # The price is that this runs on ubuntu, so Windows-only code goes
      # unlinted. The per-OS jobs below are what catch it.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # The same six targets the release builds for. When this is green there is no
  # compile error left to learn about at the tag.
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - windows-11-arm
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}

      # The X11 headers are what the editor side asks for, and the Linux
      # runners do not carry them. Xvfb is for the tests; the reason is on the
      # Test step below.
      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcb1-dev pkg-config xvfb

      # clap-host's tests load clap-test-plugin's cdylib. cargo will not build
      # another package's cdylib on its own, so it is built once before the
      # tests run.
      #
      # `--locked` belongs on this call and no other: once it passes, Cargo.lock
      # already agrees with the resolved graph, so nothing later in the run can
      # rewrite it. One word, and a lock that has come loose is found while the
      # pull request is open rather than at the tag.
      - name: Build the test fixtures
        run: cargo build --workspace --locked

      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --workspace

      # The Linux window tests open real X windows, so the runner needs an X
      # server. Running them under Xvfb is what keeps "not one test in CI opens
      # a window" from being true of Linux.
      - name: Test (under an X server)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --workspace

      # What the release actually hands out is a release build, so the check
      # goes that far.
      - name: Build release
        run: cargo build --workspace --release

      # What is handed out is a bundle rather than a bare shared library, so
      # the packing is exercised here too. Learning at the tag that the bundler
      # is broken is late.
      - name: Bundle
        run: cargo xtask bundle audio-graph-plugin --release

      # Which formats appear is decided by the symbols the binary exports.
      # Losing one of the two shows up nowhere else, so both are checked for.
      #
      # By their contents, not merely their names. What a host loads is the
      # binary inside the bundle, and an empty shell of a directory looks
      # present by name while coming up empty on load. VST3 is a bundle on
      # every OS; CLAP is a bundle on macOS alone and the shared library itself
      # elsewhere, so both shapes are allowed.
      - name: Verify both bundles exist
        shell: bash
        run: |
          for bundle in target/bundled/AudioGraph.vst3 target/bundled/AudioGraph.clap; do
            if [ -d "$bundle" ]; then
              binary=$(find "$bundle/Contents" -type f -size +0 2>/dev/null | head -n 1)
              if [ -z "$binary" ]; then
                echo "::error::$bundle の中にバイナリがありません。"
                ls -R "$bundle" || true
                exit 1
              fi
              echo "$bundle: $binary"
            elif [ -s "$bundle" ]; then
              echo "$bundle: 共有ライブラリ"
            else
              echo "::error::$bundle が生成されていません。"
              exit 1
            fi
          done
