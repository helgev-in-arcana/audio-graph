[package]
name = "wrapper-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
plugin-host-api.workspace = true
subhost-adapter.workspace = true
vst3-host.workspace = true
vst3-host-view.workspace = true
nice-plug = "0.3"
nice-log = "0.3"
log.workspace = true
serde.workspace = true
serde_json.workspace = true
nice-plug-egui = "0.4"
parking_lot = "0.12"
# `default_fonts` is not optional in practice: nice-plug-egui pulls egui in
# with default features off, and without the embedded fonts every label,
# heading and button in the editor renders as nothing at all.
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
