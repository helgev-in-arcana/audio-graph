[package]
name = "clap-host"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
plugin-host-api.workspace = true
host-window.workspace = true
clap-sys.workspace = true
log.workspace = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[target."cfg(unix)".dependencies]
libc = "0.2"

[dev-dependencies]
plugin-host-api.workspace = true

# For `poll(2)`: `clap.posix-fd-support` is the host promising to watch a
# plugin's descriptors, which means actually watching them.
[target."cfg(all(unix, not(target_os = \"macos\")))".dependencies]
libc = "0.2"
