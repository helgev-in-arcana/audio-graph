[package]
name = "audio-graph-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
audio-graph-settings = { path = "../audio-graph-settings" }
plugin-host.workspace = true
plugin-scan.workspace = true
subhost-adapter.workspace = true
audio-graph-engine = { workspace = true, features = ["ui"] }
nice-plug = "0.4"
nice-log = "0.3"
log.workspace = true
serde.workspace = true
serde_json.workspace = true
# Keep the GUI stack on egui 0.36 / baseview 0.3.2, including in future releases.
# baseview 0.4.1 leaks Win32 timers and uses a destroyed HWND during cleanup;
# this affects AudioGraph inside DAWs as well as host-cli. 0.4.0 has timer-ID
# collisions, so it is not a safe fallback. Revisit only after an upstream fix
# and Windows VST3/CLAP tests covering sustained display and repeated open/close.
# nice-plug-egui 0.5 still supports nice-plug-core 0.4, keeping the audio API intact.
nice-plug-egui = "=0.5.0"
# Explicit transitive pin: do not let a GUI dependency update bypass the above.
baseview = "=0.3.2"
parking_lot = "0.12"
# `default_fonts` is not optional in practice: nice-plug-egui pulls egui in
# with default features off, and without the embedded fonts every label,
# heading and button in the editor renders as nothing at all.
# Match nice-plug-egui 0.5 and audio-graph-engine; upgrade this stack together.
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
raw-window-handle = "0.6"

[dev-dependencies]
dotenvy.workspace = true

[features]
# Abort if anything allocates inside `process` (M5's DoD). Not on by default —
# the check costs time on every block — so it is a deliberate run:
#
#   cargo xtask bundle audio-graph-plugin --release --features assert_process_allocs
#   cargo run -p host-cli -- nest target/bundled/AudioGraph.vst3 <a sub-plugin>.vst3
#
# An allocation on the audio thread aborts the process rather than being
# reported, which is the right severity: it is a bug that only shows up as an
# occasional glitch on someone else's machine.
assert_process_allocs = ["nice-plug/assert_process_allocs"]
