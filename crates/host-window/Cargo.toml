[package]
name = "host-window"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
log.workspace = true

# No plugin-format dependency, on purpose. A container window is a titled
# rectangle; the moment it knows what a VST3 is, the CLAP backend has to
# either depend on the VST3 one or grow a second copy of this file.

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse"] }

# x11rb rather than libX11: it speaks the X protocol directly, so there is no
# system library to find at build time and no global error handler to fight
# over with the DAW and every other plugin in the process. Already in the tree
# through baseview, which is what the wrapper's own editor is built on.
[target."cfg(all(unix, not(target_os = \"macos\")))".dependencies]
x11rb = "0.14"
# For `poll(2)`, which is how a plugin's descriptors actually get watched.
libc = "0.2"
