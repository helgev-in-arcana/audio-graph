[package]
name = "host-window"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]

# No plugin-format dependency, on purpose. A container window is a titled
# rectangle; the moment it knows what a VST3 is, the CLAP backend has to
# either depend on the VST3 one or grow a second copy of this file.

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse"] }
