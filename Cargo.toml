[workspace]
resolver = "3"
members = [
    "crates/audio-graph-settings",
    "crates/plugin-host-api",
    "crates/plugin-module",
    "crates/host-window",
    "crates/vst3-host",
    "crates/vst3-host-view",
    "crates/clap-host",
    "crates/clap-test-plugin",
    "crates/vst3-test-plugin",
    "crates/plugin-host",
    "crates/plugin-scan",
    "crates/subhost-adapter",
    "crates/audio-graph-engine",
    "crates/audio-graph-plugin",
    "crates/host-cli",
    "xtask",
]

[workspace.package]
version = "0.1.6"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
plugin-host-api = { path = "crates/plugin-host-api" }
plugin-module = { path = "crates/plugin-module" }
vst3-host = { path = "crates/vst3-host" }
vst3-host-view = { path = "crates/vst3-host-view" }
host-window = { path = "crates/host-window" }
clap-host = { path = "crates/clap-host" }
plugin-host = { path = "crates/plugin-host" }
plugin-scan = { path = "crates/plugin-scan" }
subhost-adapter = { path = "crates/subhost-adapter" }
audio-graph-engine = { path = "crates/audio-graph-engine" }

vst3 = "0.3.0"
clap-sys = "0.5.0"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Test-only: reads a developer's `.env` for the plugins installed on their
# machine. See `.env.example`.
dotenvy = "0.15"
