[workspace]
resolver = "3"
members = [
    "crates/plugin-host-api",
    "crates/host-window",
    "crates/vst3-host",
    "crates/vst3-host-view",
    "crates/clap-host",
    "crates/clap-test-plugin",
    "crates/plugin-host",
    "crates/subhost-adapter",
    "crates/audio-graph-engine",
    "crates/audio-graph-plugin",
    "crates/host-cli",
    "xtask",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
plugin-host-api = { path = "crates/plugin-host-api" }
vst3-host = { path = "crates/vst3-host" }
vst3-host-view = { path = "crates/vst3-host-view" }
host-window = { path = "crates/host-window" }
clap-host = { path = "crates/clap-host" }
plugin-host = { path = "crates/plugin-host" }
subhost-adapter = { path = "crates/subhost-adapter" }
audio-graph-engine = { path = "crates/audio-graph-engine" }

vst3 = "0.3.0"
clap-sys = "0.5.0"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# baseview 0.3.1 の X11 バックエンドは `AncestorVisibilityState` の `Debug` を
# `debug_assertions` で条件付けしているのに、それを渡す `dbg!` は素で置いている。
# その結果 X11 の release ビルドだけが型エラーで落ちる。上流のバグで、こちらの
# コードからは避けようがない。このパッケージにだけ debug assertions を戻して
# derive を生かす。baseview が直ったら消す。
[profile.release.package.baseview]
debug-assertions = true
